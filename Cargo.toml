[workspace]
resolver = "2"
members = [
  "crates/browser-kit",
  "crates/ddd",
  "crates/dioxus-kit",
  "crates/gallery",
  "crates/hotkey-editor",
  "crates/tw-macro",
  "crates/warcraft-keybinds",
]

[workspace.package]
authors = ["clemenscodes"]
edition = "2024"
license = "AGPL-3.0-only"
version = "0.1.0"

# This is a virtual workspace (no root `[package]`), so crane cannot derive a
# crate name for the shared deps/artifacts derivations and falls back to a
# noisy placeholder. Naming the workspace here silences that warning.
[workspace.metadata.crane]
name = "warcraft-hotkey-editor"

[workspace.dependencies]
browser-kit = { path = "crates/browser-kit" }
ddd = { path = "crates/ddd" }
dioxus-kit = { path = "crates/dioxus-kit" }
tw-macro = { path = "crates/tw-macro" }
warcraft-keybinds = { path = "crates/warcraft-keybinds" }
dioxus = { version = "=0.7.9" }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", default-features = false }
warcraft-api = { git = "https://github.com/clemenscodes/warcraft-data", tag = "v0.1.0" }
warcraft-database = { git = "https://github.com/clemenscodes/warcraft-data", tag = "v0.1.0" }

[profile.release]
codegen-units = 16
opt-level = 3
lto = false
panic = 'unwind'
strip = "symbols"
