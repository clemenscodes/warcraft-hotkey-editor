[workspace]
resolver = "2"
members = [
  "crates/gallery",
  "crates/hotkey-editor",
]

[workspace.package]
authors = ["clemenscodes"]
edition = "2024"
license = "AGPL-3.0-only"
version = "0.1.0"

# This is a virtual workspace (no root `[package]`), so crane cannot derive a
# crate name for the shared deps/artifacts derivations and falls back to a
# noisy placeholder. Naming the workspace here silences that warning.
[workspace.metadata.crane]
name = "warcraft-hotkey-editor"

[workspace.dependencies]
dioxus = { version = "=0.7.9" }
browser-kit = { git = "https://github.com/clemenscodes/browser-kit", tag = "v0.1.0" }
ddd = { git = "https://github.com/clemenscodes/ddd", tag = "v0.1.0" }
dioxus-gallery = { git = "https://github.com/clemenscodes/dioxus-gallery", tag = "v0.1.0" }
dioxus-kit = { git = "https://github.com/clemenscodes/dioxus-kit", tag = "v0.1.0" }
tw-macro = { git = "https://github.com/clemenscodes/tw-macro", tag = "v0.1.0" }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", default-features = false }
warcraft-api = { git = "https://github.com/clemenscodes/warcraft-data", tag = "v0.4.0" }
warcraft-keybinds = { git = "https://github.com/clemenscodes/warcraft-data", tag = "v0.4.0" }

# Tuned for a shipped WASM SPA: size is the Lighthouse lever, and the app is
# DOM-bound (per-frame Rust work is light), so trading compile time and raw
# opt-level for a smaller binary is the right call. `opt-level = "z"` is the one
# knob to revisit if interaction latency ever regresses — bump it to "s".
# `panic = "abort"` drops the unwinding machinery and its JS glue; cargo forces
# unwind back on for `cargo test`, so the native keybinds tests are unaffected.
[profile.release]
codegen-units = 1
opt-level = "z"
lto = "fat"
panic = "abort"
strip = "symbols"
