id: gallery
stack: frontend
layer: application
tags:
  - rust
  - app
language: rust

dependsOn:
  - hotkey-editor

tasks:
  dx/serve:
    toolchain: system
    command: dx serve --package gallery --bin gallery --platform web --port 8200
    options:
      outputStyle: stream
      interactive: true
      runFromWorkspaceRoot: false
      cache: false
    deps:
      - hotkey-editor:tailwind/build

  dx/serve-container:
    toolchain: system
    command: dx serve --package gallery --bin gallery --platform web --addr 0.0.0.0 --port 8200
    options:
      outputStyle: stream
      interactive: false
      runFromWorkspaceRoot: false
      cache: false
    deps:
      - hotkey-editor:tailwind/build
