[package]
name = "gallery"
authors.workspace = true
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Generic Dioxus component previewer and isolator."

[lib]
path = "src/lib.rs"

[[bin]]
name = "gallery"
path = "src/main.rs"

[dependencies]
dioxus = { workspace = true, features = ["web", "launch", "macro"] }
hotkey-editor = { path = "../hotkey-editor" }
warcraft-api = { path = "../warcraft-api" }
warcraft-database = { path = "../warcraft-database" }
warcraft-keybinds = { path = "../warcraft-keybinds" }
web-sys = { version = "0.3", features = ["Window", "Location", "History"] }
wasm-bindgen = "0.2"
