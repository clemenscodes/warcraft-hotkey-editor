[package]
name = "gallery"
authors.workspace = true
edition.workspace = true
license.workspace = true
version.workspace = true
description = "App-specific stories and glue for the dioxus-gallery previewer."

[[bin]]
name = "gallery"
path = "src/main.rs"

[dependencies]
dioxus = { workspace = true, features = ["web", "launch", "macro"] }
dioxus-gallery = { workspace = true }
hotkey-editor = { path = "../hotkey-editor" }
warcraft-api = { workspace = true }
warcraft-database = { workspace = true }
warcraft-keybinds = { workspace = true }
web-sys = { version = "0.3", features = ["Window", "Location", "History"] }
wasm-bindgen = "0.2"
