[package]
name = "browser-kit"
authors.workspace = true
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Framework-agnostic browser-platform primitives for Rust web apps: localStorage + codecs (storage) and DOM helpers (dom), with native no-op fallbacks."

[lib]
path = "src/lib.rs"

[dependencies]
flate2 = "1.1.9"
base64 = "0.22.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.126"
js-sys = "0.3.103"
web-sys = { version = "0.3", features = [
  "Window",
  "Storage",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlAnchorElement",
  "HtmlInputElement",
  "Blob",
  "BlobPropertyBag",
  "Url",
  "Node",
  "NodeList",
] }
